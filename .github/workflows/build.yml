name: Build Realme SM6375 Kernel with KernelSU Next

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel/source

      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel/source/
          config: vendor/holi-qgki_defconfig
          arch: arm64
          aosp-clang: true
          aosp-clang-version: r530567
          aosp-gcc: true
          android-version: 16
          ksu-other: true
          ksu-url: https://github.com/KernelSU-Next/KernelSU-Next
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
